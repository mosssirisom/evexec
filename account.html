<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
<meta name="robots" content="noindex,nofollow" />
<meta name="theme-color" content="#020813" />
<title>My Account | EV Exec</title>
<link rel="icon" href="./public/favicon.svg" type="image/svg+xml" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600;700&family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
<style>
:root{
  --bg:#020813; --card:#07111f; --card2:rgba(255,255,255,.05);
  --gold:#d5a538; --gold2:#f2c66d; --line:rgba(255,255,255,.1);
  --muted:rgba(255,255,255,.62); --muted-dim:rgba(255,255,255,.42);
  --danger:#f87171; --success:#4ade80; --radius:20px;
}
*{box-sizing:border-box}
body{
  margin:0; background:
    radial-gradient(circle at 70% 3%,rgba(48,99,160,.2),transparent 30%),
    radial-gradient(circle at 18% 18%,rgba(213,165,56,.08),transparent 30%),
    var(--bg);
  color:#fff; font-family:Inter,Arial,sans-serif; padding-bottom:88px;
  -webkit-tap-highlight-color:transparent;
}
.serif{font-family:'Cormorant Garamond',serif}
.gold{color:var(--gold)}
.muted{color:var(--muted)}
.dim{color:var(--muted-dim)}
.wrap{max-width:640px;margin:0 auto;padding:16px 16px 24px}
.hidden{display:none!important}
button{font-family:inherit}

/* ── header ───────────────────────────────────────────────────── */
.header{
  position:sticky;top:0;z-index:40;padding:14px 16px;
  background:linear-gradient(180deg,rgba(2,8,19,.98),rgba(2,8,19,.85));
  border-bottom:1px solid rgba(255,255,255,.07); backdrop-filter:blur(20px);
}
.head-inner{max-width:640px;margin:0 auto;display:flex;align-items:center;gap:12px;min-height:32px}
.head-back{
  width:34px;height:34px;border-radius:11px;border:1px solid rgba(255,255,255,.12);
  background:rgba(255,255,255,.04);color:#fff;display:grid;place-items:center;flex:0 0 auto;cursor:pointer;
}
.head-title{font-size:17px;font-weight:800;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.brand{display:flex;align-items:center;gap:12px;color:white;text-decoration:none;flex:1;min-width:0}
.brand img{width:38px;height:38px;border-radius:50%;object-fit:cover;flex:0 0 auto}
.brand-title{font-weight:900;letter-spacing:.2em;font-size:14px}
.brand-sub{font-size:10px;color:var(--muted-dim);letter-spacing:.24em;text-transform:uppercase}

/* ── shared building blocks ──────────────────────────────────── */
.card{
  background:linear-gradient(180deg,rgba(255,255,255,.07),rgba(255,255,255,.03));
  border:1px solid var(--line); border-radius:var(--radius); padding:20px;
  box-shadow:0 22px 70px rgba(0,0,0,.35);
}
.card + .card{margin-top:12px}
.input{
  width:100%;min-height:48px;border-radius:12px;border:1px solid rgba(255,255,255,.14);
  background:rgba(255,255,255,.06);color:#fff;padding:0 14px;outline:none;font-size:15px;
  transition:border-color .15s;
}
.input:focus{border-color:rgba(213,165,56,.55)}
label.field{display:block;margin-bottom:14px}
label.field .field-label{display:block;margin-bottom:6px;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted-dim);font-weight:800}
.btn{border-radius:14px;padding:13px 18px;font-weight:800;border:0;cursor:pointer;font-size:14px;transition:opacity .15s,transform .1s}
.btn:active{transform:scale(.98)}
.btn:disabled{opacity:.5;cursor:default;transform:none}
.btn-gold{background:linear-gradient(135deg,#f1c56a,#d5a538 55%,#a97918);color:#06101c;box-shadow:0 14px 34px rgba(213,165,56,.2)}
.btn-ghost{background:rgba(255,255,255,.05);color:#fff;border:1px solid rgba(255,255,255,.14)}
.btn-danger-ghost{background:rgba(248,113,113,.08);color:var(--danger);border:1px solid rgba(248,113,113,.25)}
.btn-block{width:100%}
.tab{padding:11px 17px;border-radius:999px;font-size:13px;font-weight:800;color:rgba(255,255,255,.58);background:rgba(255,255,255,.045);border:1px solid rgba(255,255,255,.08);white-space:nowrap;cursor:pointer}
.tab.active{background:rgba(213,165,56,.14);border-color:rgba(213,165,56,.45);color:var(--gold)}
.mini{font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--muted-dim);font-weight:800}
.pill{display:inline-flex;padding:5px 11px;border-radius:999px;border:1px solid rgba(213,165,56,.32);background:rgba(213,165,56,.1);color:var(--gold);font-size:10.5px;font-weight:800;letter-spacing:.06em;text-transform:uppercase}

/* list rows (Uber-style: icon, two lines of text, trailing chevron/value) */
.row-group{border-radius:var(--radius);border:1px solid var(--line);overflow:hidden;background:rgba(255,255,255,.03)}
.row{display:flex;align-items:center;gap:14px;padding:16px;border-bottom:1px solid rgba(255,255,255,.06);color:inherit;text-decoration:none;background:none;border-left:0;border-right:0;border-top:0;width:100%;text-align:left;cursor:pointer}
.row:last-child{border-bottom:0}
.row-ico{width:42px;height:42px;border-radius:14px;background:rgba(213,165,56,.1);display:grid;place-items:center;color:var(--gold);flex:0 0 auto}
.row-ico.plain{background:rgba(255,255,255,.06);color:#fff}
.row-body{flex:1;min-width:0}
.row-title{font-weight:700;font-size:15px}
.row-sub{margin:2px 0 0;font-size:13px;color:var(--muted)}
.row-chev{color:var(--muted-dim);flex:0 0 auto}
.svg{stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.svg-fill{fill:currentColor;stroke:none}

/* skeleton loading */
@keyframes shimmer{0%{background-position:-200% 0}100%{background-position:200% 0}}
.sk{border-radius:10px;background:linear-gradient(90deg,rgba(255,255,255,.06) 25%,rgba(255,255,255,.12) 37%,rgba(255,255,255,.06) 63%);background-size:400% 100%;animation:shimmer 1.4s ease infinite}
.sk-line{height:14px;margin:6px 0}
.sk-row{display:flex;align-items:center;gap:14px;padding:16px}
.sk-circle{width:42px;height:42px;border-radius:14px;flex:0 0 auto}

/* toasts */
.toast-stack{position:fixed;left:0;right:0;bottom:96px;z-index:80;display:flex;flex-direction:column;align-items:center;gap:8px;pointer-events:none;padding:0 16px}
.toast{
  pointer-events:auto;max-width:420px;width:100%;display:flex;align-items:center;gap:10px;
  padding:13px 16px;border-radius:14px;font-size:13.5px;font-weight:600;
  background:#101a2c;border:1px solid rgba(255,255,255,.12);box-shadow:0 14px 40px rgba(0,0,0,.45);
  animation:toast-in .22s ease;
}
.toast.success{border-color:rgba(74,222,128,.35)}
.toast.error{border-color:rgba(248,113,113,.4)}
@keyframes toast-in{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}

/* confirm dialog */
.overlay{position:fixed;inset:0;background:rgba(2,6,14,.72);backdrop-filter:blur(3px);z-index:90;display:grid;place-items:end center;padding:0}
.sheet{width:100%;max-width:480px;background:#0a1424;border:1px solid var(--line);border-top-left-radius:24px;border-top-right-radius:24px;padding:24px 20px calc(24px + env(safe-area-inset-bottom));animation:sheet-in .2s ease}
@media(min-width:560px){.overlay{place-items:center}.sheet{border-radius:24px}}
@keyframes sheet-in{from{transform:translateY(24px);opacity:0}to{transform:translateY(0);opacity:1}}

/* bottom nav */
.bottom-nav{position:fixed;left:0;right:0;bottom:0;z-index:60;background:rgba(5,11,23,.94);border-top:1px solid rgba(255,255,255,.08);backdrop-filter:blur(20px);padding:8px 0 calc(8px + env(safe-area-inset-bottom))}
.bn-inner{max-width:640px;margin:0 auto;display:flex}
.bn-btn{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;background:none;border:0;color:var(--muted-dim);padding:6px 4px;cursor:pointer}
.bn-btn.active{color:var(--gold)}
.bn-label{font-size:10.5px;font-weight:700}

/* avatar + upload */
.avatar-wrap{position:relative;width:88px;height:88px;margin:0 auto}
.avatar-img{width:88px;height:88px;border-radius:50%;object-fit:cover;border:2px solid rgba(213,165,56,.4);background:#0a1424;display:block}
.avatar-edit{position:absolute;right:-2px;bottom:-2px;width:30px;height:30px;border-radius:50%;background:var(--gold);color:#06101c;display:grid;place-items:center;border:3px solid var(--bg);cursor:pointer}

/* toggle switch */
.switch-row{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:15px 0;border-bottom:1px solid rgba(255,255,255,.07)}
.switch-row:last-child{border-bottom:0}
.switch{position:relative;width:46px;height:27px;flex:0 0 auto;border-radius:999px;background:rgba(255,255,255,.14);border:0;cursor:pointer;transition:background .15s}
.switch.on{background:var(--gold)}
.switch::after{content:'';position:absolute;top:2.5px;left:2.5px;width:22px;height:22px;border-radius:50%;background:#fff;transition:transform .15s}
.switch.on::after{transform:translateX(19px)}
.switch:disabled{opacity:.5;cursor:default}

/* empty state */
.empty{padding:44px 18px;text-align:center}
.empty-icon{width:72px;height:72px;margin:0 auto 18px;border-radius:22px;border:1px solid rgba(213,165,56,.34);display:grid;place-items:center;background:rgba(213,165,56,.08);color:var(--gold)}

/* rewards */
.reward{position:relative;overflow:hidden;border-radius:26px;padding:30px 22px;background:radial-gradient(circle at 82% 18%,rgba(213,165,56,.16),transparent 22%),linear-gradient(145deg,rgba(255,255,255,.08),rgba(255,255,255,.025));border:1px solid rgba(213,165,56,.38)}
.orb{position:absolute;right:20px;top:28px;width:92px;height:92px;border-radius:50%;display:grid;place-items:center;background:rgba(255,255,255,.04);border:1px solid rgba(213,165,56,.42)}
.orb strong{font-size:38px}
.progress{height:10px;background:rgba(255,255,255,.08);border-radius:999px;overflow:hidden;margin-top:12px}
.progress span{display:block;height:100%;width:0;background:linear-gradient(90deg,#f2c66d,#d5a538,#a97918);transition:width .4s ease}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:20px}
.stat{border-radius:16px;padding:14px;text-align:center;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.1)}
.stat strong{font-size:24px;display:block}

/* card brand chip */
.card-chip{width:42px;height:30px;border-radius:6px;background:rgba(255,255,255,.08);display:grid;place-items:center;font-size:9px;font-weight:900;letter-spacing:.04em;text-transform:uppercase;color:var(--muted)}
#cardElement{background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.14);border-radius:12px;padding:14px}

.search-row{display:flex;gap:8px;margin-bottom:14px}
.chip-row{display:flex;gap:6px;overflow-x:auto;margin-bottom:14px;scrollbar-width:none}
.chip-row::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;padding:8px 14px;border-radius:999px;font-size:12.5px;font-weight:700;color:var(--muted);background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.1);cursor:pointer}
.chip.active{background:rgba(213,165,56,.15);color:var(--gold);border-color:rgba(213,165,56,.4)}
</style>
</head>
<body>

<header class="header"><div class="head-inner" id="headInner">
  <a href="/" class="brand"><img src="./public/images/ev-exec-image-3.jpg" alt="EV Exec logo"><div><div class="brand-title">EV EXEC</div><div class="brand-sub">My Account</div></div></a>
</div></header>

<main class="wrap" id="app">
  <!-- auth gate ─────────────────────────────────────────────── -->
  <section id="authGate" style="min-height:70vh;display:grid;place-items:center">
    <div style="max-width:390px;width:100%;text-align:center">
      <img src="./public/images/ev-exec-image-3.jpg" alt="EV Exec logo" style="width:72px;height:72px;border-radius:50%;object-fit:cover;margin:0 auto 18px;display:block">
      <h1 class="serif" style="font-size:38px;margin:0 0 8px">My Account</h1>
      <p class="muted" style="margin-bottom:22px">Sign in to manage your journeys, rewards, payments and preferences.</p>
      <div id="authTabs" style="display:flex;gap:8px;justify-content:center;margin-bottom:16px">
        <button class="tab active" data-tab="signin">Sign In</button>
        <button class="tab" data-tab="signup">Create Account</button>
      </div>
      <div id="tabSignin" class="card" style="text-align:left">
        <label class="field"><span class="field-label">Email address</span><input class="input" id="siEmail" type="email" autocomplete="email"></label>
        <label class="field"><span class="field-label">Password</span><input class="input" id="siPassword" type="password" autocomplete="current-password"></label>
        <button class="btn btn-gold btn-block" id="siBtn">Sign In</button>
        <p id="siMsg" style="text-align:center;font-size:12.5px;min-height:16px;margin:10px 0 0"></p>
        <button id="forgotBtn" style="background:none;border:0;color:var(--muted-dim);width:100%;padding:8px;cursor:pointer">Forgot password?</button>
      </div>
      <div id="tabSignup" class="card hidden" style="text-align:left">
        <label class="field"><span class="field-label">Full name</span><input class="input" id="suName" autocomplete="name"></label>
        <label class="field"><span class="field-label">Phone number</span><input class="input" id="suPhone" type="tel" autocomplete="tel"></label>
        <label class="field"><span class="field-label">Email address</span><input class="input" id="suEmail" type="email" autocomplete="email"></label>
        <label class="field"><span class="field-label">Password (min 8 characters)</span><input class="input" id="suPassword" type="password" autocomplete="new-password"></label>
        <button class="btn btn-gold btn-block" id="suBtn">Create Account</button>
        <p id="suMsg" style="text-align:center;font-size:12.5px;min-height:16px;margin:10px 0 0"></p>
      </div>
      <div id="tabReset" class="card hidden" style="text-align:left">
        <p class="muted" style="margin-top:0">Enter your email and we'll send a reset link.</p>
        <label class="field"><span class="field-label">Email address</span><input class="input" id="rpEmail" type="email"></label>
        <button class="btn btn-gold btn-block" id="rpBtn">Send Reset Link</button>
        <p id="rpMsg" style="text-align:center;font-size:12.5px;min-height:16px;margin:10px 0 0"></p>
        <button id="backToSignin" style="background:none;border:0;color:var(--muted-dim);width:100%;padding:8px;cursor:pointer">Back to Sign In</button>
      </div>
    </div>
  </section>

  <!-- signed-in app ─────────────────────────────────────────── -->
  <section id="dashboard" class="hidden">
    <div id="view"></div>
  </section>
</main>

<nav class="bottom-nav hidden" id="bottomNav">
  <div class="bn-inner">
    <button class="bn-btn" data-nav="home"><svg class="svg" width="22" height="22" viewBox="0 0 24 24"><path d="M3 11l9-8 9 8"/><path d="M5 10v10h14V10"/></svg><span class="bn-label">Home</span></button>
    <button class="bn-btn" data-nav="trips"><svg class="svg" width="22" height="22" viewBox="0 0 24 24"><path d="M5 16l1.6-4.8A3 3 0 019.4 9h5.2a3 3 0 012.8 2.2L19 16"/><circle cx="8" cy="17" r="1.5"/><circle cx="16" cy="17" r="1.5"/><path d="M4 16h16"/></svg><span class="bn-label">Trips</span></button>
    <button class="bn-btn" data-nav="account"><svg class="svg" width="22" height="22" viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21c1.5-4 5-6 8-6s6.5 2 8 6"/></svg><span class="bn-label">Account</span></button>
  </div>
</nav>

<div class="toast-stack" id="toastStack"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="https://js.stripe.com/v3/"></script>
<script>
(async () => {
'use strict';

// ── config + supabase client ──────────────────────────────────────────────
let cfg = {};
try { cfg = await fetch('/api/config').then(r => r.json()); } catch (e) {}
const $ = id => document.getElementById(id);

if (!cfg.supabaseUrl || !cfg.supabaseAnon) {
  $('authGate').innerHTML = '<p class="muted">Account system not configured.</p>';
  return;
}
const sb = supabase.createClient(cfg.supabaseUrl, cfg.supabaseAnon);
let stripe = null;
if (cfg.stripePublishableKey && window.Stripe) stripe = Stripe(cfg.stripePublishableKey);

// ── state ────────────────────────────────────────────────────────────────
let session = null, profile = null, journeys = [], addresses = [], paymentMethods = [], defaultPmId = null;
let route = 'home'; // home | trips | account | account/profile | account/payments | account/rewards | account/notifications | account/security | account/addresses
let tripFilter = 'all', tripQuery = '';

function esc(s) { return String(s == null ? '' : s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;'); }
function initials(name) { return String(name||'').trim().split(/\s+/).slice(0,2).map(w=>w[0]||'').join('').toUpperCase() || 'EV'; }
function tier(pts) { return pts >= 20 ? 'Executive' : pts >= 10 ? 'Preferred' : 'Client'; }

async function api(path, opts = {}) {
  const { data: { session: s } } = await sb.auth.getSession();
  const headers = Object.assign({ 'Content-Type': 'application/json' }, opts.headers || {});
  if (s) headers.Authorization = 'Bearer ' + s.access_token;
  const res = await fetch(path, { ...opts, headers });
  const data = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(data.error || 'Something went wrong. Please try again.');
  return data;
}

// ── toasts ───────────────────────────────────────────────────────────────
function toast(text, type = '') {
  const stack = $('toastStack');
  const el = document.createElement('div');
  el.className = 'toast' + (type ? ' ' + type : '');
  el.textContent = text;
  stack.appendChild(el);
  setTimeout(() => { el.style.opacity = '0'; el.style.transition = 'opacity .25s'; setTimeout(() => el.remove(), 250); }, 3200);
}

// ── confirm dialog ───────────────────────────────────────────────────────
function confirmDialog({ title, body, confirmLabel = 'Confirm', danger = true }) {
  return new Promise(resolve => {
    const overlay = document.createElement('div');
    overlay.className = 'overlay';
    overlay.innerHTML = `<div class="sheet">
      <h2 style="margin:0 0 8px;font-size:19px">${esc(title)}</h2>
      <p class="muted" style="margin:0 0 20px">${esc(body)}</p>
      <button class="btn btn-block ${danger ? 'btn-danger-ghost' : 'btn-gold'}" id="cdConfirm">${esc(confirmLabel)}</button>
      <button class="btn btn-ghost btn-block" id="cdCancel" style="margin-top:10px">Cancel</button>
    </div>`;
    document.body.appendChild(overlay);
    overlay.querySelector('#cdConfirm').onclick = () => { overlay.remove(); resolve(true); };
    overlay.querySelector('#cdCancel').onclick = () => { overlay.remove(); resolve(false); };
    overlay.addEventListener('click', e => { if (e.target === overlay) { overlay.remove(); resolve(false); } });
  });
}

// ── skeletons ────────────────────────────────────────────────────────────
function skeletonRows(n = 3) {
  return Array.from({ length: n }).map(() =>
    `<div class="sk-row"><div class="sk sk-circle"></div><div style="flex:1"><div class="sk sk-line" style="width:60%"></div><div class="sk sk-line" style="width:40%"></div></div></div>`
  ).join('<div style="border-bottom:1px solid rgba(255,255,255,.06)"></div>');
}

// ── header (title + back button on sub-views) ───────────────────────────
const TOP_LEVEL = ['home', 'trips', 'account'];
function renderHeader() {
  const isSub = !TOP_LEVEL.includes(route);
  const titles = {
    home: '', trips: 'Trips', account: 'Account',
    'account/profile': 'Profile', 'account/payments': 'Payments',
    'account/rewards': 'Rewards', 'account/notifications': 'Notifications',
    'account/security': 'Security', 'account/addresses': 'Saved Addresses'
  };
  if (!isSub) {
    $('headInner').innerHTML = `<a href="/" class="brand"><img src="./public/images/ev-exec-image-3.jpg" alt="EV Exec logo"><div><div class="brand-title">EV EXEC</div><div class="brand-sub">My Account</div></div></a>`;
  } else {
    $('headInner').innerHTML = `<button class="head-back" id="backBtn"><svg class="svg" width="18" height="18" viewBox="0 0 24 24"><path d="M15 18l-6-6 6-6"/></svg></button><div class="head-title">${esc(titles[route] || '')}</div>`;
    $('backBtn').onclick = () => go('account');
  }
}

function go(r) { route = r; location.hash = r; render(); window.scrollTo({ top: 0, behavior: 'smooth' }); }
window.addEventListener('hashchange', () => { route = (location.hash || '#home').slice(1); render(); });

// ── data loading ─────────────────────────────────────────────────────────
async function loadAll() {
  try {
    const [pr, jr, ar] = await Promise.all([
      api('/api/account/profile'),
      api('/api/account/journeys'),
      api('/api/account/addresses')
    ]);
    profile = pr.profile;
    journeys = jr.journeys || [];
    addresses = ar.addresses || [];
  } catch (e) {
    toast(e.message, 'error');
  }
  render();
}

async function loadPaymentMethods() {
  try {
    const r = await api('/api/account/payment-methods');
    paymentMethods = r.paymentMethods || [];
    defaultPmId = r.defaultId;
  } catch (e) { toast(e.message, 'error'); }
}

// ── VIEW: home ───────────────────────────────────────────────────────────
function viewHome() {
  const completed = journeys.filter(j => j.status === 'Completed').length;
  const upcoming = journeys.filter(j => !['Completed','Cancelled'].includes(j.status));
  const pts = profile?.privilege_points ?? completed;
  const name = profile?.full_name || session.user.user_metadata?.full_name || session.user.email;
  const avatar = profile?.avatar_url
    ? `<img class="avatar-img" style="width:56px;height:56px" src="${esc(profile.avatar_url)}" alt="">`
    : `<div class="avatar-img" style="width:56px;height:56px;display:grid;place-items:center;font-weight:800;font-size:18px">${esc(initials(name))}</div>`;

  return `
    <div class="card" style="display:flex;align-items:center;gap:16px">
      ${avatar}
      <div style="min-width:0;flex:1">

function statusOf(j) { return j.customer_status || (j.status === 'Completed' ? 'Trip Completed' : j.status === 'Cancelled' ? 'Unavailable' : j.status || 'Awaiting Approval'); }
function payLine(j) {
  if (!j.quoted_price || j.status === 'Cancelled') return '';
  const label = j.payment_status === 'Paid' ? 'Paid' : j.payment_method === 'cash' ? 'Cash on the day' : j.payment_method ? 'Card payment' : 'Payment pending';
  return `<p class="row-sub" style="margin-top:2px">£${j.quoted_price} · ${esc(label)}</p>`;
}
function routeText(j) {
  return j.journey_type === 'From Airport'
    ? `${j.airport || 'Airport'} → ${j.dropoff_address || 'Destination'}`
    : `${j.pickup_location || 'Pickup'} → ${j.airport || 'Airport'}`;
}

function viewTrips() {
  const q = tripQuery.trim().toLowerCase();
  let list = journeys;
  if (tripFilter === 'upcoming') list = list.filter(j => !['Completed','Cancelled'].includes(j.status));
  if (tripFilter === 'completed') list = list.filter(j => j.status === 'Completed');
  if (q) list = list.filter(j => (j.ref||'').toLowerCase().includes(q) || routeText(j).toLowerCase().includes(q));

  const chips = [['all','All'],['upcoming','Upcoming'],['completed','Completed']]
    .map(([k,l]) => `<button class="chip ${tripFilter===k?'active':''}" data-filter="${k}">${l}</button>`).join('');

  const body = !journeys.length
    ? `<div class="empty"><div class="empty-icon"><svg class="svg" width="34" height="34" viewBox="0 0 24 24"><path d="M5 16l1.6-4.8A3 3 0 019.4 9h5.2a3 3 0 012.8 2.2L19 16"/><circle cx="8" cy="17" r="1.5"/><circle cx="16" cy="17" r="1.5"/><path d="M4 16h16"/></svg></div><h2 style="font-size:17px">No journeys yet</h2><p class="muted">Your completed transfers and receipts will appear here automatically.</p></div>`
    : !list.length
      ? `<div class="empty"><p class="muted">No trips match that search.</p></div>`
      : `<div class="row-group">${list.map(j => `
        <div class="row" data-trip="${esc(j.id)}" style="cursor:pointer">

async function openTripDetail(id) {

let pushLocalState = false;
async function refreshPushState() {
  try {
    if (!('serviceWorker' in navigator) || !('PushManager' in window)) { pushLocalState = false; return; }
    const reg = await navigator.serviceWorker.getRegistration();
    const sub = reg ? await reg.pushManager.getSubscription() : null;
    pushLocalState = Boolean(sub) && profile?.push_enabled !== false;
  } catch { pushLocalState = false; }
}

function urlB64ToUint8Array(b64) {
  const pad = '='.repeat((4 - b64.length % 4) % 4);
  const raw = atob(b64.replace(/-/g, '+').replace(/_/g, '/') + pad);
  return Uint8Array.from(Array.from(raw).map(c => c.charCodeAt(0)));
}

function wireNotifications() {
  const toggle = async (key, current) => {
    try { const d = await api('/api/account/profile', { method: 'PATCH', body: JSON.stringify({ [key]: !current }) }); profile = d.profile; toast('Preference saved', 'success'); }
    catch (e) { toast(e.message, 'error'); }
    renderInto();
  };
  $('swEmail').onclick = () => toggle('notify_email', profile?.notify_email !== false);
  $('swSms').onclick = () => toggle('notify_sms', profile?.notify_sms !== false);
  $('swPush').onclick = async () => {
    const btn = $('swPush'); btn.disabled = true;
    try {
      if (pushLocalState) {
        const reg = await navigator.serviceWorker.getRegistration();
        const sub = reg ? await reg.pushManager.getSubscription() : null;
        if (sub) await sub.unsubscribe();
        await api('/api/account/profile', { method: 'PATCH', body: JSON.stringify({ push_enabled: false }) });
        toast('Push notifications turned off');
      } else {
        if (!cfg.vapidPublic) throw new Error('Push notifications are not configured yet.');
        const perm = await Notification.requestPermission();
        if (perm !== 'granted') throw new Error('Notification permission was not granted.');
        const reg = await navigator.serviceWorker.register('/public/sw.js');
        await navigator.serviceWorker.ready;
        const sub = await reg.pushManager.subscribe({ userVisibleOnly: true, applicationServerKey: urlB64ToUint8Array(cfg.vapidPublic) });
        const subJson = sub.toJSON();
        await fetch('/api/notifications/subscribe', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json', Authorization: 'Bearer ' + session.access_token },
          body: JSON.stringify({ endpoint: subJson.endpoint, keys: subJson.keys, customer_email: session.user.email })
        });
        await api('/api/account/profile', { method: 'PATCH', body: JSON.stringify({ push_enabled: true }) });
        toast('Push notifications enabled', 'success');
      }
      profile = (await api('/api/account/profile')).profile;
      await refreshPushState();
    } catch (e) { toast(e.message, 'error'); }
    finally { btn.disabled = false; renderInto(); }
  };
}

// ── VIEW: security ───────────────────────────────────────────────────────
function viewSecurity() {
  return `
    <div class="card">
      <div class="mini" style="margin-bottom:14px">Change Password</div>
      <label class="field"><span class="field-label">New password</span><input class="input" id="newPwd" type="password" autocomplete="new-password"></label>
      <label class="field"><span class="field-label">Confirm new password</span><input class="input" id="newPwd2" type="password" autocomplete="new-password"></label>
      <button class="btn btn-gold btn-block" id="changePwdBtn">Update Password</button>
      <p id="pwdMsg" class="muted" style="min-height:16px;margin:10px 0 0"></p>
    </div>
  `;
}

function wireSecurity() {
  $('changePwdBtn').onclick = async () => {
    const p1 = $('newPwd').value, p2 = $('newPwd2').value, m = $('pwdMsg');
    m.style.color = '';
    if (p1.length < 8) { m.style.color = 'var(--danger)'; m.textContent = 'Password must be at least 8 characters.'; return; }
    if (p1 !== p2) { m.style.color = 'var(--danger)'; m.textContent = 'Passwords do not match.'; return; }
    const { error } = await sb.auth.updateUser({ password: p1 });
    if (error) { m.style.color = 'var(--danger)'; m.textContent = error.message; }
    else { m.style.color = 'var(--success)'; m.textContent = 'Password updated.'; $('newPwd').value = ''; $('newPwd2').value = ''; toast('Password updated', 'success'); }
  };
}

// ── VIEW: addresses ──────────────────────────────────────────────────────
function viewAddresses() {
  const list = addresses.length
    ? `<div class="row-group">${addresses.map(a => `
        <div class="row" style="cursor:default">
          <div class="row-ico plain"><svg class="svg" width="18" height="18" viewBox="0 0 24 24"><path d="M12 21s7-6.4 7-12a7 7 0 10-14 0c0 5.6 7 12 7 12z"/><circle cx="12" cy="9" r="2.5"/></svg></div>
          <div class="row-body"><div class="row-title">${esc(a.label)}</div><p class="row-sub">${esc(a.address)}</p></div>
          <button class="btn btn-danger-ghost" data-del-addr="${esc(a.id)}" style="flex:0 0 auto;padding:8px 12px;font-size:12px">Remove</button>
        </div>`).join('')}</div>`
    : `<div class="empty" style="padding:24px"><p class="muted">No saved addresses yet.</p></div>`;

  return `
    ${list}
    <div class="card" style="margin-top:14px">
      <div class="mini" style="margin-bottom:12px">Add an Address</div>
      <label class="field"><span class="field-label">Label</span><input class="input" id="addrLabel" placeholder="e.g. Home"></label>
      <label class="field"><span class="field-label">Address</span><input class="input" id="addrValue" placeholder="Full address"></label>
      <button class="btn btn-gold btn-block" id="addAddrBtn">Add Address</button>
      <p id="addrMsg" class="muted" style="min-height:16px;margin:10px 0 0"></p>
    </div>
  `;
}

function wireAddresses() {
  $('addAddrBtn').onclick = async () => {
    const label = $('addrLabel').value.trim(), address = $('addrValue').value.trim(), m = $('addrMsg');
    m.style.color = '';
    if (!label || !address) { m.style.color = 'var(--danger)'; m.textContent = 'Enter a label and address.'; return; }
    try {
      await api('/api/account/addresses', { method: 'POST', body: JSON.stringify({ label, address }) });
      const ar = await api('/api/account/addresses'); addresses = ar.addresses || [];
      toast('Address saved', 'success');
      renderInto();
    } catch (e) { m.style.color = 'var(--danger)'; m.textContent = e.message; }
  };
  document.querySelectorAll('[data-del-addr]').forEach(b => b.onclick = async () => {
    if (!await confirmDialog({ title: 'Remove this address?', body: 'You can add it again later.', confirmLabel: 'Remove' })) return;
    try {
      await api('/api/account/addresses?id=' + encodeURIComponent(b.dataset.delAddr), { method: 'DELETE' });
      addresses = addresses.filter(a => a.id !== b.dataset.delAddr);
      toast('Address removed', 'success');
      renderInto();
    } catch (e) { toast(e.message, 'error'); }
  });
}

// ── render dispatch ──────────────────────────────────────────────────────
const VIEWS = {
  home: { render: viewHome, wire: wireHome },
  trips: { render: viewTrips, wire: wireTrips },
  account: { render: viewAccount, wire: wireAccount },
  'account/profile': { render: viewProfile, wire: wireProfile },
  'account/payments': { render: viewPayments, wire: wirePayments, before: async () => { if (stripe) await loadPaymentMethods(); } },
  'account/rewards': { render: viewRewards },
  'account/notifications': { render: viewNotifications, wire: wireNotifications, before: refreshPushState },
  'account/security': { render: viewSecurity, wire: wireSecurity },
  'account/addresses': { render: viewAddresses, wire: wireAddresses },
};

function renderInto() {
  const v = VIEWS[route] || VIEWS.home;
  $('view').innerHTML = v.render();
  document.querySelectorAll('[data-go]').forEach(b => b.onclick = () => go(b.dataset.go));
  if (v.wire) v.wire();
}

async function render() {
  renderHeader();
  const v = VIEWS[route] || VIEWS.home;
  $('view').innerHTML = skeletonRows(3);
  if (v.before) await v.before();
  renderInto();
  document.querySelectorAll('.bn-btn').forEach(b => b.classList.toggle('active', route === b.dataset.nav || route.startsWith(b.dataset.nav + '/')));
}

document.querySelectorAll('.bn-btn').forEach(b => b.onclick = () => go(b.dataset.nav));

// ── auth wiring ──────────────────────────────────────────────────────────
document.querySelectorAll('#authTabs [data-tab]').forEach(b => b.onclick = () => {
  document.querySelectorAll('#authTabs .tab').forEach(x => x.classList.remove('active'));
  b.classList.add('active');
  $('tabSignin').classList.toggle('hidden', b.dataset.tab !== 'signin');
  $('tabSignup').classList.toggle('hidden', b.dataset.tab !== 'signup');
  $('tabReset').classList.add('hidden');
});
$('forgotBtn').onclick = () => { $('tabSignin').classList.add('hidden'); $('tabSignup').classList.add('hidden'); $('tabReset').classList.remove('hidden'); };
$('backToSignin').onclick = () => { $('tabReset').classList.add('hidden'); $('tabSignin').classList.remove('hidden'); };

function msg(el, text, ok = false) { el.style.color = ok ? 'var(--success)' : 'var(--danger)'; el.textContent = text; }

$('siBtn').onclick = async () => {
  const m = $('siMsg'); m.style.color = ''; m.textContent = 'Signing in…';
  const { error } = await sb.auth.signInWithPassword({ email: $('siEmail').value.trim(), password: $('siPassword').value });
  if (error) msg(m, error.message);
};
$('suBtn').onclick = async () => {
  const m = $('suMsg'); m.style.color = ''; m.textContent = 'Creating account…';
  const { error } = await sb.auth.signUp({ email: $('suEmail').value.trim(), password: $('suPassword').value, options: { data: { full_name: $('suName').value.trim(), phone: $('suPhone').value.trim() } } });
  error ? msg(m, error.message) : msg(m, 'Account created. Check your email if confirmation is required.', true);
};
$('rpBtn').onclick = async () => {
  const { error } = await sb.auth.resetPasswordForEmail($('rpEmail').value.trim(), { redirectTo: location.origin + '/account' });
  error ? msg($('rpMsg'), error.message) : msg($('rpMsg'), 'Reset link sent.', true);
};

sb.auth.onAuthStateChange(async (_, s) => {
  session = s;
  if (session) {
    $('authGate').classList.add('hidden');
    $('dashboard').classList.remove('hidden');
    $('bottomNav').classList.remove('hidden');
    route = (location.hash || '#home').slice(1);
    if (!VIEWS[route]) route = 'home';
    await loadAll();
  } else {
    $('authGate').classList.remove('hidden');
    $('dashboard').classList.add('hidden');
    $('bottomNav').classList.add('hidden');
  }
});

const { data: { session: initial } } = await sb.auth.getSession();
if (initial) {
  session = initial;
  $('authGate').classList.add('hidden');
  $('dashboard').classList.remove('hidden');
  $('bottomNav').classList.remove('hidden');
  route = (location.hash || '#home').slice(1);
  if (!VIEWS[route]) route = 'home';
  await loadAll();
}
})();
</script>
</body>
</html>
